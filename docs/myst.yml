        - file: sciserver_example.md
          children:
            - file: sciserver_notebooks/IGPwinter.md
            - file: sciserver_notebooks/KangerFjord.md
            - file: sciserver_notebooks/LLC4320.md
            - file: sciserver_notebooks/ECCO_plot_stations.md
        - file: bud_tut.md
          children:
            - file: budget_tutorial/mean_eul_budg.ipynb
            - file: budget_tutorial/particle_bud_tut.ipynb
    # -- Contributing -----------------------------------------------------
    - title: Contributing
      children:
        - file: guide_for_developer.md
          children:
            - file: contribute/use_git.md
            - file: contribute/prep_env.md
            - file: contribute/contr_cod.md
            - file: contribute/contr_doc.md
            - file: contribute/report_iss.md
            - file: contribute/tidyNpr.md

