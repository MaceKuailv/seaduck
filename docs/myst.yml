          children:
            - file: one_min_guide.ipynb
            - file: network_of_object.md
        - file: public_api_reference.md
          children:
            - file: api/OceData.md
            - file: api/topology.md
            - file: api/eulerian.md
            - file: api/lagrangian.md
            - file: api/OceInterp.md
            - file: api/kernelNweight.md
            - file: api/eulerian_budget.md
            - file: api/lagrangian_budget.md
        - file: internal_api_reference.md
          children:
            - file: api/smartread.md
            - file: api/getmasks.md
            - file: api/utils.md
            - file: api/RelCoord.md
    # -- Examples ---------------------------------------------------------
    - title: Examples
      children:
        - file: ideal_test.md
          children:
            - file: idealize_test/hor_stream.ipynb
            - file: idealize_test/ver_stream.ipynb
            - file: idealize_test/tilted_stream.ipynb
        - file: ocean_example.md
          children:
            - file: notebook/global_ECCO.ipynb
            - file: notebook/AVISO.ipynb
            - file: notebook/ASTE_sd.Particle_example.ipynb
