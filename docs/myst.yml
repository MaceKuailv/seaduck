version: 1

project:
  title: Seaduck Tutorial
  authors:
    - name: Wenrui Jiang
  github: https://github.com/MaceKuailv/seaduck
  # Notebooks are executed at build time (see the docs-build make target).
  jupyter: true
  toc:
    - file: intro.md
    # -- Tutorial ---------------------------------------------------------
    - title: Tutorial
      children:
        - file: how_to_install.md
        - file: how_to_cite.md
